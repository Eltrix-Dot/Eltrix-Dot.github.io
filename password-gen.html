<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eltrix | Vault Gen v2.0</title>
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #05070a;
            --card: #0d1117;
            --text: #e6edf3;
            --border: #30363d;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .vault-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative;
        }

        .display-box {
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #output {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--primary);
            word-break: break-all;
        }

        .copy-btn {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.3s;
        }

        .copy-btn:hover { background: var(--primary); color: #000; }

        .strength-meter {
            height: 4px;
            background: #21262d;
            border-radius: 2px;
            margin-bottom: 5px;
        }

        #bar { width: 0%; height: 100%; transition: 0.4s; border-radius: 2px; }

        #crack-time { font-size: 0.7rem; color: #8b949e; margin-bottom: 25px; display: block; }

        .slider-group { margin-bottom: 20px; }
        input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option-label {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .gen-button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .gen-button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 242, 255, 0.2); }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.75rem;
            color: #484f58;
            letter-spacing: 1px;
        }
    </style>

<style>
    /* Eltrix unified Sky Blue theme */
    :root {
        --sky-blue: #0E94FF;
        --mid-blue: #4BB0FF;
        --cloud-white: #FDFDFE;
        --pure-white: #FFFFFF;
        --dark-slate: #0F172A;
        --soft-border: rgba(15, 23, 42, 0.06);
        --soft-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05);
    }

    html,
    body {
        background-color: #FDFDFE !important;
        background-image: linear-gradient(180deg, #0E94FF 0%, #4BB0FF 45%, #FDFDFE 100%) !important;
        background-repeat: no-repeat !important;
        background-size: 100% 520px !important;
        color: #0F172A !important;
    }

    .hero-section,
    .hero {
        background: linear-gradient(180deg, #0E94FF 0%, #4BB0FF 45%, #FDFDFE 100%) !important;
        background-repeat: no-repeat !important;
        color: #FFFFFF;
    }

    h1, h2, h3, h4, h5, h6, p, li, label, .muted, .card-desc, .section-subtitle {
        color: #0F172A;
    }

    .hero-section h1, .hero-section h2, .hero-section p,
    .hero h1, .hero h2, .hero p,
    .main-content > .big-title, .main-content > .page-title {
        color: #FFFFFF !important;
    }

    .top-nav-bar,
    .navbar {
        background: transparent !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border-bottom: 1px solid transparent !important;
        box-shadow: none !important;
        color: #0F172A !important;
        position: sticky;
        top: 0;
        z-index: 1000;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    .top-nav-bar a, .top-nav-bar button, .top-nav-bar .site-title,
    .navbar a, .navbar button, .navbar .brand,
    .top-nav-bar .social-icon, .navbar .nav-links a,
    .nav-btn, .nav-links a {
        color: #0F172A !important;
        text-shadow: none !important;
    }

    .top-nav-bar.is-scrolled,
    .navbar.is-scrolled {
        background: transparent !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border-bottom-color: transparent !important;
        box-shadow: none !important;
    }

    .top-nav-bar .social-icon,
    .top-nav-bar .menu-toggle,
    .navbar .social-icon,
    .navbar .menu-toggle {
        background: rgba(255, 255, 255, 0.72) !important;
        color: #0F172A !important;
        border: 1px solid rgba(15, 23, 42, 0.10) !important;
    }

    .top-nav-bar .menu-toggle span,
    .navbar .menu-toggle span {
        background-color: #0F172A !important;
    }

    .mobile-menu,
    .dropdown-menu,
    .nav-menu,
    .menu-panel {
        background: #FFFFFF !important;
        color: #0F172A !important;
        border: 1px solid rgba(15, 23, 42, 0.08) !important;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12) !important;
    }

    .mobile-menu a,
    .mobile-menu .menu-item,
    .dropdown-menu a,
    .dropdown-menu .menu-item,
    .nav-menu a,
    .nav-menu .menu-item,
    .menu-panel a,
    .menu-panel .menu-item {
        color: #0F172A !important;
    }

    .mobile-menu a:hover,
    .mobile-menu .menu-item:hover,
    .dropdown-menu a:hover,
    .dropdown-menu .menu-item:hover,
    .nav-menu a:hover,
    .nav-menu .menu-item:hover,
    .menu-panel a:hover,
    .menu-panel .menu-item:hover {
        background: #F1F5F9 !important;
        color: #0F172A !important;
    }

    .section, .card, .feature-card, .tool-card, .risk-card, .app-card,
    .info-section, .ecopulse-card, .breach-card, .vault-card {
        background: #FFFFFF !important;
        border: 1px solid rgba(15, 23, 42, 0.06) !important;
        border-radius: 16px;
        box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05) !important;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .section:hover, .card:hover, .feature-card:hover, .tool-card:hover,
    .risk-card:hover, .app-card:hover, .info-section:hover,
    .ecopulse-card:hover, .breach-card:hover, .vault-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 34px -8px rgba(15, 23, 42, 0.10) !important;
    }

    .btn-primary, .btn-check, .btn-panic, .btn-alert {
        background: #0E94FF !important;
        border-color: #0E94FF !important;
        color: #FFFFFF !important;
    }

    .site-footer, footer {
        background: #FDFDFE !important;
        color: #0F172A !important;
        border-color: rgba(15, 23, 42, 0.06) !important;
    }

    .site-footer *, footer * { color: #0F172A; }
</style>
</head>
<body>

<div class="container">
    <a href="https://eltrix-dot.github.io/privacymain.html" class="back-link">← BACK TO INTELLIGENCE SUITE</a>
    
    <div class="vault-card">
        <h2 style="margin:0; font-size: 1.5rem;">VAULT GENERATOR</h2>
        <p style="font-size: 0.8rem; color: #8b949e; margin: 5px 0 20px 0;">Local-only secure string creation.</p>

        <div class="display-box">
            <span id="output">ELTRIX-READY</span>
            <button class="copy-btn" onclick="copyPwd()">COPY</button>
        </div>

        <div class="strength-meter"><div id="bar"></div></div>
        <span id="crack-time">Estimated crack time: Instant</span>

        <div class="slider-group">
            <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:10px;">
                <span>Length</span>
                <span id="len-val" style="color:var(--primary); font-weight:bold;">16</span>
            </div>
            <input type="range" id="slider" min="8" max="64" value="16">
        </div>

        <div class="options">
            <label class="option-label"><input type="checkbox" id="nums" checked> Numbers</label>
            <label class="option-label"><input type="checkbox" id="syms" checked> Symbols</label>
            <label class="option-label"><input type="checkbox" id="caps" checked> Uppercase</label>
            <label class="option-label"><input type="checkbox" id="safe"> Avoid Ambiguous</label>
        </div>

        <button class="gen-button" onclick="generate()">GENERATE STRING</button>
    </div>

    <footer>
        ELTRIX DIGITAL SYSTEMS © 2026 | SECURED BY END-TO-END ENCRYPTION
    </footer>
</div>

<script>
    const slider = document.getElementById('slider');
    const lenVal = document.getElementById('len-val');
    
    slider.oninput = () => { lenVal.innerText = slider.value; }

    function generate() {
        const length = slider.value;
        const includeNums = document.getElementById('nums').checked;
        const includeSyms = document.getElementById('syms').checked;
        const includeCaps = document.getElementById('caps').checked;
        const avoidAmbiguous = document.getElementById('safe').checked;

        let charset = "abcdefghijklmnopqrstuvwxyz";
        if (includeCaps) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        if (includeNums) charset += "0123456789";
        if (includeSyms) charset += "!@#$%^&*()_+-=[]{}|;:,.<>?";
        
        if (avoidAmbiguous) {
            charset = charset.replace(/[Il1O0]/g, "");
        }

        let result = "";
        const array = new Uint32Array(length);
        window.crypto.getRandomValues(array);

        for (let i = 0; i < length; i++) {
            result += charset[array[i] % charset.length];
        }

        document.getElementById('output').innerText = result;
        updateUI(length, charset.length);
    }

    function updateUI(len, charCount) {
        const bar = document.getElementById('bar');
        const timeText = document.getElementById('crack-time');
        
        // Brute force entropy calculation
        const entropy = Math.log2(Math.pow(charCount, len));
        
        let color = "#ff4d4d";
        let time = "Seconds";

        if (entropy > 60) { color = "#f59e0b"; time = "Weeks"; }
        if (entropy > 80) { color = "#10b981"; time = "Years"; }
        if (entropy > 110) { color = "#00f2ff"; time = "Centuries"; }

        bar.style.width = Math.min(entropy/1.2, 100) + "%";
        bar.style.backgroundColor = color;
        timeText.innerText = `Estimated crack time: ${time} (${Math.floor(entropy)} bits)`;
    }

    function copyPwd() {
        const text = document.getElementById('output').innerText;
        if(text === "ELTRIX-READY") return;
        navigator.clipboard.writeText(text);
        alert("Encrypted string copied to clipboard.");
    }
</script>


<script>
    (() => {
        const navigation = document.querySelectorAll('.top-nav-bar, .navbar');
        if (!navigation.length) return;
        const updateNavigation = () => {
            navigation.forEach((element) => element.classList.toggle('is-scrolled', window.scrollY > 8));
        };
        window.addEventListener('scroll', updateNavigation, { passive: true });
        updateNavigation();
    })();
</script>
</body>
</html>
