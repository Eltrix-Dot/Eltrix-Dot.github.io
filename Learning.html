<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning | Eltrix</title>
<style>
:root { --sky-blue:#0E94FF; --mid-blue:#4BB0FF; --cloud-white:#FDFDFE; --dark-slate:#0F172A; }
html, body { min-height:100%; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:#FDFDFE; background-image:linear-gradient(180deg,#0E94FF 0%,#4BB0FF 45%,#FDFDFE 100%); background-repeat:no-repeat; background-size:100% 520px; color:#0F172A; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
button { padding:12px 22px; border:1px solid rgba(15,23,42,.08); border-radius:12px; background:#FFFFFF; color:#0F172A; font:700 1rem inherit; box-shadow:0 10px 30px -5px rgba(15,23,42,.05); cursor:pointer; }
button:hover { transform:translateY(-2px); box-shadow:0 14px 34px -8px rgba(15,23,42,.1); }
</style>
</head>
<body>
<button>Hello</button>
</body>
</html>
