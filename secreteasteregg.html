<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eltrix | Root Terminal</title>
    <style>
        :root {
            --term-green: #10b981;
            --term-blue: #00f2ff;
            --term-bg: #05070a;
            --danger: #ff4d4d;
        }

        body {
            background-color: var(--term-bg);
            color: var(--term-blue);
            font-family: 'JetBrains Mono', monospace;
            margin: 0; padding: 20px;
            height: 100vh; display: flex; flex-direction: column;
            box-sizing: border-box; overflow: hidden;
            transition: background 0.3s;
        }

        /* Pixar Animation Styles */
        .eltrix-logo {
            font-size: 3rem; font-weight: 900;
            display: flex; gap: 5px; margin-bottom: 20px;
            height: 80px; align-items: flex-end;
        }

        .letter { display: inline-block; transition: transform 0.2s; }
        
        .jump-i {
            animation: jump 1.5s ease infinite;
            color: var(--term-green);
        }

        @keyframes jump {
            0%, 100% { transform: translateY(0) scaleY(1); }
            30% { transform: translateY(-60px) scaleY(1.1); } /* Iets hoger voor effect */
            50% { transform: translateY(0) scaleY(0.5); }    /* Hardere landing */
            60% { transform: translateY(0) scaleY(1); }
        }

        .squish { animation: squish 1.5s ease infinite; }
        @keyframes squish {
            0%, 45%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.4); } /* Diepere squish */
        }

        /* Terminal UI */
        #output { flex-grow: 1; overflow-y: auto; white-space: pre-wrap; margin-bottom: 20px; }
        .input-area { display: flex; align-items: center; gap: 10px; border-top: 1px solid #1f2937; padding-top: 15px; }
        .prompt { color: var(--term-green); font-weight: bold; }
        input { background: transparent; border: none; color: #fff; font-family: inherit; font-size: 1rem; width: 100%; outline: none; }
        
        @keyframes red-alert {
            0% { background-color: #05070a; }
            50% { background-color: #330000; }
            100% { background-color: #05070a; }
        }

        .error-msg { color: var(--danger); font-weight: bold; }
        .success-msg { color: var(--term-green); }
        footer { font-size: 0.7rem; color: #374151; text-align: center; margin-top: 10px; }
    </style>

<style>
    /* Eltrix unified Sky Blue theme */
    :root {
        --sky-blue: #0095FF;
        --mid-blue: #56B8FF;
        --cloud-white: #F8FAFC;
        --pure-white: #FFFFFF;
        --dark-slate: #0F172A;
        --soft-border: rgba(15, 23, 42, 0.06);
        --soft-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05);
    }

    html,
    body {
        background-color: var(--cloud-white) !important;
        background-image: none !important;
        color: var(--dark-slate) !important;
    }

    .hero-section,
    .hero {
        background: linear-gradient(180deg, #0095FF 0%, #56B8FF 55%, #F8FAFC 100%) !important;
        background-repeat: no-repeat !important;
        color: var(--pure-white);
    }

    h1, h2, h3, h4, h5, h6, p, li, label, .muted, .card-desc, .section-subtitle {
        color: var(--dark-slate);
    }

    .hero-section h1, .hero-section h2, .hero-section p,
    .hero h1, .hero h2, .hero p,
    .main-content > .big-title, .main-content > .page-title,
    .header h1, .header-box h1 {
        color: var(--pure-white) !important;
    }

    .top-nav-bar,
    .navbar {
        background: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(15, 23, 42, 0.06) !important;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04) !important;
        color: var(--dark-slate) !important;
        position: sticky;
        top: 0;
        z-index: 1000;
        transition: background 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .top-nav-bar a, .top-nav-bar button, .top-nav-bar .site-title,
    .navbar a, .navbar button, .navbar .brand,
    .top-nav-bar .social-icon, .navbar .nav-links a,
    .nav-btn, .nav-links a {
        color: var(--dark-slate) !important;
    }

    .top-nav-bar.is-scrolled,
    .navbar.is-scrolled {
        background: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom-color: rgba(15, 23, 42, 0.06) !important;
    }

    .top-nav-bar .social-icon,
    .top-nav-bar .menu-toggle,
    .navbar .social-icon,
    .navbar .menu-toggle {
        background: rgba(15, 23, 42, 0.06) !important;
        color: var(--dark-slate) !important;
    }

    .top-nav-bar .menu-toggle span,
    .navbar .menu-toggle span {
        background-color: var(--dark-slate) !important;
    }

    .mobile-menu,
    .dropdown-menu,
    .nav-menu,
    .menu-panel {
        background: var(--pure-white) !important;
        color: var(--dark-slate) !important;
        border: 1px solid var(--soft-border) !important;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12) !important;
    }

    .mobile-menu a,
    .mobile-menu .menu-item,
    .dropdown-menu a,
    .dropdown-menu .menu-item,
    .nav-menu a,
    .nav-menu .menu-item,
    .menu-panel a,
    .menu-panel .menu-item {
        color: #0F172A !important;
    }

    .mobile-menu a:hover,
    .mobile-menu .menu-item:hover,
    .dropdown-menu a:hover,
    .dropdown-menu .menu-item:hover,
    .nav-menu a:hover,
    .nav-menu .menu-item:hover,
    .menu-panel a:hover,
    .menu-panel .menu-item:hover {
        background: #F1F5F9 !important;
        color: #0F172A !important;
    }

    .section, .card, .feature-card, .tool-card, .risk-card, .app-card,
    .info-section, .ecopulse-card, .breach-card, .vault-card {
        background: var(--pure-white) !important;
        border: 1px solid var(--soft-border) !important;
        border-radius: 16px;
        box-shadow: var(--soft-shadow) !important;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .section:hover, .card:hover, .feature-card:hover, .tool-card:hover,
    .risk-card:hover, .app-card:hover, .info-section:hover,
    .ecopulse-card:hover, .breach-card:hover, .vault-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 34px -8px rgba(15, 23, 42, 0.10) !important;
    }

    .btn-primary, .btn-check, .btn-panic, .btn-alert {
        background: var(--sky-blue) !important;
        border-color: var(--sky-blue) !important;
        color: var(--pure-white) !important;
    }

    .site-footer, footer {
        background: var(--cloud-white) !important;
        color: var(--dark-slate) !important;
        border-color: var(--soft-border) !important;
    }

    .site-footer *, footer * { color: var(--dark-slate); }

    @media (prefers-reduced-motion: reduce) {
        .section, .card, .feature-card, .tool-card, .risk-card, .app-card,
        .info-section, .ecopulse-card, .breach-card, .vault-card,
        .top-nav-bar, .navbar { transition: none !important; }
    }
</style>
</head>
<body id="terminal-body">

<div id="logo-container" class="eltrix-logo">
    <span class="letter">E</span>
    <span class="letter">L</span>
    <span class="letter">T</span>
    <span class="letter">R</span>
    <span id="letter-i" class="letter">I</span>
    <span class="letter">X</span>
</div>

<div id="output">
<div>[SYSTEM READY] - Unauthorized access is prohibited.</div>
<div>Type <span style="color:white">'help'</span> for a list of commands.</div>
<br>
</div>

<div class="input-area">
    <span class="prompt">root@eltrix:~$</span>
    <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
</div>

<footer>ELTRIX DIGITAL SYSTEMS © 2026</footer>

<script>
    const input = document.getElementById('cmd-input');
    const output = document.getElementById('output');
    const body = document.getElementById('terminal-body');
    const letterI = document.getElementById('letter-i');
    const letters = document.querySelectorAll('.letter');

    const commands = {
        'help': 'Available commands:\n- ls: List all modules\n- connect [name]: Open a module\n- eltrix: Start the Eltrix Easter Egg\n- hack: Execute breach simulation\n- matrix: Glitch the reality\n- clear: Purge screen',
        'ls': 'Modules:\n> fortress.html\n> password-gen.html\n> webcheck.html\n> breachpulse.html',
        'whoami': 'Eltrix Root Admin. Access Level: Omega.'
    };

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const raw = input.value.trim();
            const cmd = raw.toLowerCase(); // Alles naar kleine letters
            
            printLine(`<span class="prompt">root@eltrix:~$</span> ${raw}`);

            // Aangepaste check naar 'eltrix' (kleine letters)
            if (cmd === 'eltrix') {
                startEltrixEgg();
            } else if (cmd === 'hack') {
                startHackEgg();
            } else if (cmd === 'matrix') {
                startMatrixEgg();
            } else if (cmd === 'clear') {
                output.innerHTML = '';
            } else if (cmd.startsWith('connect ')) {
                const target = cmd.split(' ')[1];
                printLine(`Connecting to ${target}...`, 'success-msg');
                setTimeout(() => window.location.href = target, 1500);
            } else if (commands[cmd]) {
                printLine(commands[cmd]);
            } else {
                printLine(`Unknown command: ${cmd}`, 'error-msg');
            }

            input.value = '';
            output.scrollTop = output.scrollHeight;
        }
    });

    function printLine(text, className = '') {
        const div = document.createElement('div');
        div.className = className;
        div.innerHTML = text + '\n';
        output.appendChild(div);
    }

    // --- EASTER EGG FUNCTIONS ---

    function startEltrixEgg() {
        printLine("Initializing Eltrix.exe...", "success-msg");
        letterI.classList.add('jump-i');
        letters.forEach(l => {
            // We pletten de andere letters (behalve de I zelf)
            if (l.id !== 'letter-i') l.classList.add('squish');
        });
        
        setTimeout(() => {
            letterI.classList.remove('jump-i');
            letters.forEach(l => l.classList.remove('squish'));
            printLine("Animation sequence complete.");
        }, 6000); // 6 seconden animatie
    }

    function startHackEgg() {
        printLine("BREACH DETECTED! COUNTER-MEASURES ACTIVE!", "error-msg");
        body.style.animation = "red-alert 0.5s infinite";
        setTimeout(() => {
            body.style.animation = "none";
            printLine("Firewall stabilized.");
        }, 4000);
    }

    function startMatrixEgg() {
        printLine("Reality.sys is corrupt.", "success-msg");
        body.style.filter = "invert(1) hue-rotate(90deg)";
        setTimeout(() => {
            body.style.filter = "none";
        }, 2000);
    }
</script>


<script>
    (() => {
        const navigation = document.querySelectorAll('.top-nav-bar, .navbar');
        if (!navigation.length) return;
        const updateNavigation = () => {
            navigation.forEach((element) => element.classList.toggle('is-scrolled', window.scrollY > 8));
        };
        window.addEventListener('scroll', updateNavigation, { passive: true });
        updateNavigation();
    })();
</script>
</body>
</html>
