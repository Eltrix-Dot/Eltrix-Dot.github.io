<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Eltrix</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 480px;
        }

        .code {
            font-size: 7rem;
            font-weight: 900;
            color: #0095FF;
            letter-spacing: -4px;
            line-height: 1;
            animation: fadeUp 0.6s ease both;
        }

        .divider {
            width: 48px;
            height: 4px;
            background: #0095FF;
            border-radius: 2px;
            margin: 24px auto;
            animation: fadeUp 0.6s 0.1s ease both;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            animation: fadeUp 0.6s 0.15s ease both;
        }

        p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
            animation: fadeUp 0.6s 0.2s ease both;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeUp 0.6s 0.25s ease both;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary {
            background: #0095FF;
            color: #fff;
        }

        .btn-secondary {
            background: #fff;
            color: #0095FF;
            border: 2px solid #0095FF;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 123, 255, 0.2);
        }

        .brand {
            margin-top: 48px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #ccc;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: fadeUp 0.6s 0.3s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>

<style>
    /* Eltrix unified Sky Blue theme */
    :root {
        --sky-blue: #0095FF;
        --mid-blue: #56B8FF;
        --cloud-white: #F8FAFC;
        --pure-white: #FFFFFF;
        --dark-slate: #0F172A;
        --soft-border: rgba(15, 23, 42, 0.06);
        --soft-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05);
    }

    html,
    body {
        background-color: var(--cloud-white) !important;
        background-image: none !important;
        color: var(--dark-slate) !important;
    }

    .hero-section,
    .hero {
        background: linear-gradient(180deg, #0095FF 0%, #56B8FF 55%, #F8FAFC 100%) !important;
        background-repeat: no-repeat !important;
        color: var(--pure-white);
    }

    h1, h2, h3, h4, h5, h6, p, li, label, .muted, .card-desc, .section-subtitle {
        color: var(--dark-slate);
    }

    .hero-section h1, .hero-section h2, .hero-section p,
    .hero h1, .hero h2, .hero p,
    .main-content > .big-title, .main-content > .page-title,
    .header h1, .header-box h1 {
        color: var(--pure-white) !important;
    }

    .top-nav-bar,
    .navbar {
        background: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(15, 23, 42, 0.06) !important;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04) !important;
        color: var(--dark-slate) !important;
        position: sticky;
        top: 0;
        z-index: 1000;
        transition: background 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .top-nav-bar a, .top-nav-bar button, .top-nav-bar .site-title,
    .navbar a, .navbar button, .navbar .brand,
    .top-nav-bar .social-icon, .navbar .nav-links a,
    .nav-btn, .nav-links a {
        color: var(--dark-slate) !important;
    }

    .top-nav-bar.is-scrolled,
    .navbar.is-scrolled {
        background: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom-color: rgba(15, 23, 42, 0.06) !important;
    }

    .top-nav-bar .social-icon,
    .top-nav-bar .menu-toggle,
    .navbar .social-icon,
    .navbar .menu-toggle {
        background: rgba(15, 23, 42, 0.06) !important;
        color: var(--dark-slate) !important;
    }

    .top-nav-bar .menu-toggle span,
    .navbar .menu-toggle span {
        background-color: var(--dark-slate) !important;
    }

    .mobile-menu,
    .dropdown-menu,
    .nav-menu,
    .menu-panel {
        background: var(--pure-white) !important;
        color: var(--dark-slate) !important;
        border: 1px solid var(--soft-border) !important;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12) !important;
    }

    .mobile-menu a,
    .mobile-menu .menu-item,
    .dropdown-menu a,
    .dropdown-menu .menu-item,
    .nav-menu a,
    .nav-menu .menu-item,
    .menu-panel a,
    .menu-panel .menu-item {
        color: #0F172A !important;
    }

    .mobile-menu a:hover,
    .mobile-menu .menu-item:hover,
    .dropdown-menu a:hover,
    .dropdown-menu .menu-item:hover,
    .nav-menu a:hover,
    .nav-menu .menu-item:hover,
    .menu-panel a:hover,
    .menu-panel .menu-item:hover {
        background: #F1F5F9 !important;
        color: #0F172A !important;
    }

    .section, .card, .feature-card, .tool-card, .risk-card, .app-card,
    .info-section, .ecopulse-card, .breach-card, .vault-card {
        background: var(--pure-white) !important;
        border: 1px solid var(--soft-border) !important;
        border-radius: 16px;
        box-shadow: var(--soft-shadow) !important;
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .section:hover, .card:hover, .feature-card:hover, .tool-card:hover,
    .risk-card:hover, .app-card:hover, .info-section:hover,
    .ecopulse-card:hover, .breach-card:hover, .vault-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 34px -8px rgba(15, 23, 42, 0.10) !important;
    }

    .btn-primary, .btn-check, .btn-panic, .btn-alert {
        background: var(--sky-blue) !important;
        border-color: var(--sky-blue) !important;
        color: var(--pure-white) !important;
    }

    .site-footer, footer {
        background: var(--cloud-white) !important;
        color: var(--dark-slate) !important;
        border-color: var(--soft-border) !important;
    }

    .site-footer *, footer * { color: var(--dark-slate); }

    @media (prefers-reduced-motion: reduce) {
        .section, .card, .feature-card, .tool-card, .risk-card, .app-card,
        .info-section, .ecopulse-card, .breach-card, .vault-card,
        .top-nav-bar, .navbar { transition: none !important; }
    }
</style>
</head>
<body>

    <div class="container">
        <div class="code">404</div>
        <div class="divider"></div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>

        <div class="actions">
            <a href="https://eltrix-dot.github.io/" class="btn btn-primary">Go Home</a>
            <a href="https://eltrix-dot.github.io/privacymain" class="btn btn-secondary">Privacy Hub</a>
        </div>

        <div class="brand">Eltrix</div>
    </div>


<script>
    (() => {
        const navigation = document.querySelectorAll('.top-nav-bar, .navbar');
        if (!navigation.length) return;
        const updateNavigation = () => {
            navigation.forEach((element) => element.classList.toggle('is-scrolled', window.scrollY > 8));
        };
        window.addEventListener('scroll', updateNavigation, { passive: true });
        updateNavigation();
    })();
</script>
</body>
</html>
